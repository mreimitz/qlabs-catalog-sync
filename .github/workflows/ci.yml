name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check packages scripts

      - name: Type-check (mypy, strict)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Build wheels (one per package)
        run: uv build --all-packages --wheel -o dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error
