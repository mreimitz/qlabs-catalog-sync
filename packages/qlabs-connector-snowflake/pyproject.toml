[project]
name = "qlabs-connector-snowflake"
version = "0.0.0"
description = "QLabs Catalog Sync — Snowflake read-only source connector."
requires-python = ">=3.11"
dependencies = [
    "qlabs-catalog-sync-sdk",
    "snowflake-connector-python",
]

[project.entry-points."qlabs_catalog_sync.connectors"]
snowflake = "qlabs_connector_snowflake:Connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlabs_connector_snowflake"]

[tool.uv.sources]
qlabs-catalog-sync-sdk = { workspace = true }
