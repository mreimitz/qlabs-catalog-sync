      OBJECT_DATABASE, OBJECT_SCHEMA, OBJECT_NAME, COLUMN_NAME FROM TABLE(\"SALES_DB\".INFORMATION_SCHEMA.TAG_REFERENCES(''SALES_DB.PUBLIC.ORDERS'',
      ''TABLE''))","timeout":60}'
    headers:
      accept:
      - '*/*'
      content-type:
      - application/json
    method: POST
    uri: https://acme-primary.snowflakecomputing.com/api/v2/statements?requestId=da4ad082-61e6-46cf-88b5-a4378df155c8
  response:
    body:
      string: '{"code":"090001","statementHandle":"01b2c3d4-0000-0000-0000-0000000006c6","message":"Statement
        executed successfully.","resultSetMetaData":{"numRows":2,"format":"jsonv2","partitionInfo":[{"rowCount":2}],"rowType":[{"name":"TAG_DATABASE","type":"text","nullable":true},{"name":"TAG_SCHEMA","type":"text","nullable":true},{"name":"TAG_NAME","type":"text","nullable":true},{"name":"TAG_VALUE","type":"text","nullable":true},{"name":"DOMAIN","type":"text","nullable":true},{"name":"OBJECT_DATABASE","type":"text","nullable":true},{"name":"OBJECT_SCHEMA","type":"text","nullable":true},{"name":"OBJECT_NAME","type":"text","nullable":true},{"name":"COLUMN_NAME","type":"text","nullable":true}]},"data":[["GOVERNANCE","TAGS","COST_CENTER","commerce","TABLE","SALES_DB","PUBLIC","ORDERS",null],["SNOWFLAKE","CORE","PRIVACY_CATEGORY","IDENTIFIER","TABLE","SALES_DB","PUBLIC","ORDERS","ORDER_ID"]]}'
