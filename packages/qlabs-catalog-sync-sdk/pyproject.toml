[project]
name = "qlabs-catalog-sync-sdk"
version = "0.0.0"
description = "QLabs Catalog Sync SDK — the public contract, neutral model, shared helpers, and conformance kit."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "httpx",
    "tenacity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlabs_catalog_sync_sdk"]
