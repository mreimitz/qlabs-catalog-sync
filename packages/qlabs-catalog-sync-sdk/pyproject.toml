[project]
name = "qlabs-catalog-sync-sdk"
version = "0.0.0"
description = "QLabs Catalog Sync SDK — the public contract, neutral model, shared helpers, and conformance kit."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "structlog>=24.1,<27",
    "pyjwt[crypto]>=2.8,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlabs_catalog_sync_sdk"]
