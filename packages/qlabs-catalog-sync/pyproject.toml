[project]
name = "qlabs-catalog-sync"
version = "0.0.0"
description = "QLabs Catalog Sync engine — discovery, upstream sync loop, state store, scheduler, observability."
requires-python = ">=3.11"
dependencies = [
    "qlabs-catalog-sync-sdk",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "structlog>=24.1,<27",
    "prometheus-client>=0.20,<1",
    "click>=8.1,<9",
]

[project.scripts]
qlabs-catalog-sync = "qlabs_catalog_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlabs_catalog_sync"]

[tool.uv.sources]
qlabs-catalog-sync-sdk = { workspace = true }
