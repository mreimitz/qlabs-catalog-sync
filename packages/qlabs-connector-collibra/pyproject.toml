[project]
name = "qlabs-connector-collibra"
version = "0.0.0"
description = "QLabs Catalog Sync — Collibra read-only source connector (glossary source)."
requires-python = ">=3.11"
dependencies = [
    "qlabs-catalog-sync-sdk",
    "httpx",
]

[project.entry-points."qlabs_catalog_sync.connectors"]
collibra = "qlabs_connector_collibra:Connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlabs_connector_collibra"]

[tool.uv.sources]
qlabs-catalog-sync-sdk = { workspace = true }
