[project]
name = "qlabs-connector-databricks"
version = "0.0.0"
description = "QLabs Catalog Sync — Databricks read-only source connector."
requires-python = ">=3.11"
dependencies = [
    "qlabs-catalog-sync-sdk",
    "databricks-sdk>=0.28,<1",
]

[project.entry-points."qlabs_catalog_sync.connectors"]
databricks = "qlabs_connector_databricks:Connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlabs_connector_databricks"]

[tool.uv.sources]
qlabs-catalog-sync-sdk = { workspace = true }
