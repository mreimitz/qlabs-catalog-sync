# Hand-authored, NOT captured from a live Databricks tenant -- see
# databricks_connector_setup_and_read_schema.yaml's header comment for the RM-01
# "no live tenants" convention this follows and the RS-01 sections these payloads mirror.
# No OAuth interaction here: this cassette backs a test that calls
# qlabs_connector_databricks.read.read_schema() directly against a plain HttpEndpoint
# (no auth provider attached), exactly like tests/read/*.py's own respx-based tests do --
# the same read() the connector calls at runtime, exercised without the connector's
# OAuth wiring around it, so this test can assert on the full SchemaRead (data product
# *and* its member datasets) that Connector.read() itself only returns half of.
version: 1
