# Hand-authored, NOT captured from a live Databricks tenant. RM-01 is built without live
# tenants (planning/Roadmap/RM-01-one-way-sync-mvp/decision-databricks-to-qlik-mvp.md:
# "all tests run against respx mocks, an SDK-provided fake connector, and hand-authored
# cassettes"). Every request/response body below mirrors the field shapes documented in
# planning/Research/RS-01-databricks-catalog-api/outputs/databricks-catalog-api-reference.md
# (sections 1.2 "Metadata fields attached to objects", 3.2 "Authentication", 3.6
# "Pagination") and is byte-identical to what
# packages/qlabs-connector-databricks/tests/conformance/conftest.py's make_schema()/
# make_table() builders produce for the same arguments, so this cassette and the
# respx-mocked tests in that directory never silently drift apart.
#
# Exercised by test_read_cassettes.py's
# test_connector_setup_and_read_data_product_end_to_end: a real Connector.setup() (OAuth
# M2M token fetch) followed by Connector.read() on a DATA_PRODUCT ref -- the schema
# "prod.sales" plus the two tables/views used to prove D1's "the schema's tables/views
# are its datasets" containment (only the schema is returned by read(), but both list
# calls still happen while building it -- see read.py's SchemaRead).
version: 1
interactions:
  - request:
      method: POST
      uri: https://acme.cloud.databricks.com/oidc/v1/token
      body: grant_type=client_credentials&scope=all-apis
      headers:
        content-type: ["application/x-www-form-urlencoded"]
        authorization: ["Basic <redacted-in-a-real-recording>"]
    response:
      status:
        code: 200
        message: OK
      headers:
        content-type: ["application/json"]
      body:
        string: '{"access_token": "cassette-hand-authored-token", "token_type": "Bearer", "expires_in": 3600}'
  - request:
      method: GET
      uri: https://acme.cloud.databricks.com/api/2.1/unity-catalog/schemas?catalog_name=prod&max_results=100
      body: null
      headers:
        accept: ["*/*"]
    response:
      status:
        code: 200
        message: OK
      headers:
        content-type: ["application/json"]
      body:
        string: '{"schemas": [{"catalog_name": "prod", "name": "sales", "full_name": "prod.sales", "comment": "Sales domain schema, owned by data engineering.", "owner": "data-eng@acme.com", "properties": {"team": "sales"}, "schema_id": "b4b7c3d2-4e9a-4b1b-9a3f-2e6d9c8a7f10", "metastore_id": "11111111-2222-3333-4444-555555555555", "created_at": 1700000000000, "created_by": "admin@acme.com", "updated_at": 1700000000000, "updated_by": "data-eng@acme.com"}]}'
  - request:
      method: GET
      uri: https://acme.cloud.databricks.com/api/2.1/unity-catalog/tables?catalog_name=prod&schema_name=sales&max_results=100
      body: null
      headers:
        accept: ["*/*"]
    response:
      status:
        code: 200
        message: OK
      headers:
        content-type: ["application/json"]
      body:
        string: '{"tables": [{"catalog_name": "prod", "schema_name": "sales", "name": "orders", "full_name": "prod.sales.orders", "table_type": "MANAGED", "columns": [{"name": "order_id", "type_name": "BIGINT", "nullable": false, "position": 0, "comment": "Primary key"}, {"name": "customer_id", "type_name": "BIGINT", "nullable": false, "position": 1}, {"name": "order_total", "type_name": "DECIMAL", "nullable": true, "position": 2}], "comment": "One row per customer order.", "owner": "data-eng@acme.com", "properties": {"delta.minReaderVersion": "1"}, "table_id": "c5d8e4f3-5f0b-4c2c-8b4a-3f7e0d9b8a21", "metastore_id": "11111111-2222-3333-4444-555555555555", "created_at": 1700000000000, "created_by": "admin@acme.com", "updated_at": 1700000000000, "updated_by": "data-eng@acme.com", "data_source_format": "DELTA"}, {"catalog_name": "prod", "schema_name": "sales", "name": "customers", "full_name": "prod.sales.customers", "table_type": "VIEW", "columns": [{"name": "customer_id", "type_name": "BIGINT", "nullable": false, "position": 0}, {"name": "customer_name", "type_name": "STRING", "nullable": true, "position": 1}], "comment": "Customer-facing view over orders joined with the customer dimension.", "owner": "data-eng@acme.com", "properties": {}, "table_id": "d6e9f5a4-6f1c-4d3d-9c5b-4a8f1e0c9b32", "metastore_id": "11111111-2222-3333-4444-555555555555", "created_at": 1700000000000, "created_by": "admin@acme.com", "updated_at": 1700000000000, "updated_by": "data-eng@acme.com"}]}'
