[project]
name = "qlabs-connector-qlik"
version = "0.0.0"
description = "QLabs Catalog Sync — Qlik connector (sole write target in v1)."
requires-python = ">=3.11"
dependencies = [
    "qlabs-catalog-sync-sdk",
    "httpx>=0.27,<1",
]

[project.entry-points."qlabs_catalog_sync.connectors"]
qlik = "qlabs_connector_qlik:Connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlabs_connector_qlik"]

[tool.uv.sources]
qlabs-catalog-sync-sdk = { workspace = true }
