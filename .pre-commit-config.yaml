repos:
  - repo: local
    hooks:
      - id: validate-okf
        name: Validate OKF bundle and Research Scaffold profile
        entry: python3 .claude/scripts/okf.py validate
        language: system
        pass_filenames: false
        always_run: true
      - id: test-doc-intake
        name: Test transactional document intake
        entry: python3 -m unittest discover -s tools/tests -p test_*.py
        language: system
        pass_filenames: false
        always_run: true
